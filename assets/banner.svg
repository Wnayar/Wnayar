<svg viewBox="0 0 900 260" width="900" height="260" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="William Nayar, backend and distributed systems">
  <defs>
    <pattern id="hatch" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="12" height="12" fill="#070D14"/>
      <line x1="0" y1="0" x2="0" y2="12" stroke="#2A5D7C" stroke-width="4"/>
    </pattern>
    <clipPath id="frame"><rect width="900" height="260" rx="16"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="900" height="260" fill="#070D14"/>

    <!-- geometric cluster, right -->
    <circle cx="800" cy="18" r="112" fill="#F0B429"/>
    <circle cx="692" cy="200" r="66" fill="url(#hatch)"/>
    <circle cx="826" cy="206" r="50" fill="none" stroke="#3E7CA6" stroke-width="3"/>
    <polyline points="742,88 782,140 826,206" fill="none" stroke="#1E3A50" stroke-width="3"/>
    <circle cx="742" cy="88" r="8" fill="#2A5D7C"/>
    <circle cx="782" cy="140" r="5" fill="none" stroke="#3E7CA6" stroke-width="2.5"/>
    <!-- lockup, left -->
    <text x="56" y="120" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="76" font-weight="800" fill="#EAF0F6" letter-spacing="1">William Nayar</text>
    <rect x="58" y="142" width="132" height="7" rx="3.5" fill="#F0B429"/>
    <text x="56" y="192" font-family="Consolas,Menlo,'DejaVu Sans Mono',monospace" font-size="30" fill="#F0B429">backend &#183; distributed systems</text>
  </g>
</svg>
