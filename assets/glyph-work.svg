<svg viewBox="0 0 24 24" width="24" height="24" xmlns="http://www.w3.org/2000/svg">
  <!-- one node fanning out to three, each leaf lighting in turn -->
  <g fill="none" stroke="#4493F8" stroke-width="1.6" stroke-linecap="round">
    <line x1="9.078" y1="10.211" x2="15.816" y2="6.842" opacity="0.4"/>
    <line x1="9.5" y1="12" x2="16" y2="12" opacity="0.4"/>
    <line x1="9.078" y1="13.789" x2="15.816" y2="17.158" opacity="0.4"/>
    <circle cx="5.5" cy="12" r="2.8"/>
  </g>
  <g fill="#4493F8">
    <circle cx="18.5" cy="5.5" r="1.8" opacity="1">
      <animate attributeName="opacity" values="0.3;1;0.3;0.3" keyTimes="0;0.09;0.18;1" dur="3.6s" begin="0s" repeatCount="indefinite"/>
    </circle>
    <circle cx="19" cy="12" r="1.8" opacity="1">
      <animate attributeName="opacity" values="0.3;1;0.3;0.3" keyTimes="0;0.09;0.18;1" dur="3.6s" begin="0.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="18.5" cy="18.5" r="1.8" opacity="1">
      <animate attributeName="opacity" values="0.3;1;0.3;0.3" keyTimes="0;0.09;0.18;1" dur="3.6s" begin="0.8s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
