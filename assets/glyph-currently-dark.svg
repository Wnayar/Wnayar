<svg viewBox="0 0 24 24" width="24" height="24" xmlns="http://www.w3.org/2000/svg">
  <!-- a live signal, pulsing outward -->
  <g fill="none" stroke="#4493F8" stroke-width="2" stroke-linecap="round">
    <circle cx="12" cy="12" r="4">
      <animate attributeName="r" values="3.5;10.5" dur="2.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.85;0" dur="2.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="12" cy="12" r="8" opacity="0.4">
      <animate attributeName="r" values="3.5;10.5" dur="2.8s" begin="1.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.85;0" dur="2.8s" begin="1.4s" repeatCount="indefinite"/>
    </circle>
  </g>
  <circle cx="12" cy="12" r="3.2" fill="#4493F8"/>
</svg>
