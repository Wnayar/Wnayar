<svg viewBox="0 0 24 24" width="24" height="24" xmlns="http://www.w3.org/2000/svg">
  <!-- two nodes, one packet in flight between them -->
  <g fill="none" stroke="#4493F8" stroke-width="1.7" stroke-linecap="round">
    <circle cx="5" cy="12" r="2.9"/>
    <circle cx="19" cy="12" r="2.9"/>
    <line x1="8.7" y1="12" x2="15.3" y2="12" opacity="0.4"/>
  </g>
  <circle cx="12" cy="12" r="1.7" fill="#4493F8">
    <animate attributeName="cx" values="5;19" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.2;0.8;1" dur="3s" repeatCount="indefinite"/>
  </circle>
</svg>
